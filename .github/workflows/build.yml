name: Build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Verify NPPS4 source identity
      shell: bash
      run: |
        set -euo pipefail
        test -f app/build.gradle
        grep -Fq 'applicationId "com.npdep.npps4"' app/build.gradle
        expected_backend="$(git ls-tree HEAD app/src/main/python | awk '{print $3}')"
        actual_backend="$(git -C app/src/main/python rev-parse HEAD)"
        test -n "$expected_backend"
        test "$expected_backend" = "$actual_backend"
        mkdir -p build-evidence
        {
          echo "android_repository=Ikataku/NPPS4-Android"
          echo "android_commit=$GITHUB_SHA"
          echo "application_id=com.npdep.npps4"
          echo "backend_gitlink=$expected_backend"
          echo "backend_checkout=$actual_backend"
        } > build-evidence/source-identity.txt
    - name: Run Backend EXP regression tests
      working-directory: app/src/main/python
      run: python -m unittest discover -s tests -p 'test_*.py' -v

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Create envvars.txt
      shell: python
      env:
        ENVVARS: ${{ secrets.ENVVARS }}
      run: |
        import os
        
        with open("envvars.txt", "w", encoding="utf-8") as f:
          f.write(os.environ.get("ENVVARS", ""))

    - name: Verify admin EXP secret hygiene
      run: python scripts/verify_admin_exp_secret_hygiene.py

    - name: Build
      run: ./gradlew assemble
    - name: Verify APK identity and debug signature
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
        aapt="$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
        test -x "$apksigner"
        test -x "$aapt"
        debug_apk="app/build/outputs/apk/debug/app-debug.apk"
        release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
        "$aapt" dump badging "$debug_apk" | tee build-evidence/debug-badging.txt
        grep -Fq "package: name='com.npdep.npps4'" build-evidence/debug-badging.txt
        "$apksigner" verify --verbose --print-certs "$debug_apk" | tee build-evidence/debug-apksigner.txt
        sha256sum "$debug_apk" "$release_apk" | tee build-evidence/apk-sha256.txt
        echo "release_artifact_signing=unsigned_by_build_type" > build-evidence/release-signing.txt

    - name: Artifact Debug
      uses: actions/upload-artifact@v6
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Artifact Release Unsigned
      uses: actions/upload-artifact@v6
      with:
        name: release-apk-unsigned
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: error
    - name: Artifact Build Evidence
      uses: actions/upload-artifact@v6
      with:
        name: build-evidence
        path: build-evidence/
        if-no-files-found: error
